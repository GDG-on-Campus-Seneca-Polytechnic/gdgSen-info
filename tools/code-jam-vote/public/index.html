<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code Jam voting</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/ballot.js"></script>
</head>
<body>
  <main>
    <p class="eyebrow">GDG at Seneca</p>
    <h1 id="title">Code Jam voting</h1>
    <p id="status" role="status">Loading the ballot…</p>
    <form id="ballot" hidden>
      <fieldset id="projects">
        <legend>Choose one project</legend>
      </fieldset>
      <label for="code">Attendee code</label>
      <input id="code" placeholder="ABCD-EFGH-JKLM" required maxlength="20"
        autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button type="submit">Cast vote</button>
      <p id="message" role="status"></p>
    </form>
    <ol id="results" hidden></ol>
  </main>
</body>
</html>
